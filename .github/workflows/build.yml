name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 14.x
        uses: actions/setup-node@v6
        with:
          node-version: 14.x

      - name: Verify version consistency
        run: |
          node -e "const p=require('./package.json');const a=require('./frontend/appinfo.json');if(p.version!==a.version){console.error('Version drift: package.json='+p.version+' frontend/appinfo.json='+a.version+' — bump package.json and run npm run version');process.exit(1);}console.log('version '+p.version);"

      - name: Prepare environment
        run: |
          rm -rf ./build/*
          mkdir -p ./build

      - name: Install ares-cli globally
        run: npm install -g @webosose/ares-cli

      - name: Check packaging
        run: ares-package --check

      - name: Build package
        run: ares-package --no-minify --outdir build/ services frontend

      - name: Create manifest for distribution
        run: node tools/gen-manifest.js build/com.daverui.michelly.manifest.json

      - name: Generate repository document
        run: npm run repo

      - name: Generate remote app bundle
        run: npm run bundle

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: michelly_webos
          path: |
            ${{github.workspace}}/build/*

      - name: Publish to gh-pages
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          IPK="$(ls build/com.daverui.michelly_*_all.ipk | head -n1)"
          VERSION="$(node -p "require('./frontend/appinfo.json').version")"
          WORKTREE="/tmp/gh-pages"

          rm -rf "$WORKTREE"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --force --detach "$WORKTREE" origin/gh-pages
          else
            git worktree add --force --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan gh-pages
            git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WORKTREE/ipk" "$WORKTREE/icons"
          rm -f "$WORKTREE"/ipk/*.ipk
          cp build/repo.json "$WORKTREE/repo.json"
          cp "$IPK" "$WORKTREE/ipk/"

          rm -rf "$WORKTREE/app"
          mkdir -p "$WORKTREE/app"
          cp -R build/app/. "$WORKTREE/app/"

          touch "$WORKTREE/.nojekyll"

          git -C "$WORKTREE" add -A

          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "No publish changes to commit."
          else
            git -C "$WORKTREE" commit -m "Publish com.daverui.michelly ${VERSION}"
            git -C "$WORKTREE" push origin HEAD:gh-pages
          fi

      - name: Upload GitHub Release Artifacts
        uses: shogo82148/actions-upload-release-asset@v1
        if: ${{ github.event_name == 'release' }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: 'build/*'
          overwrite: true
